<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cámara de Maruja</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#5a3e8b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cámara Maruja">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f0f4ff, #fdf0f8);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      color: #333;
    }
    h1 { font-size: 1.6rem; color: #5a3e8b; margin-bottom: 6px; }
    .sub { color: #888; font-size: 0.9rem; margin-bottom: 24px; }

    .card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 20px rgba(90,62,139,0.12);
      margin-bottom: 16px;
    }

    video {
      width: 100%;
      border-radius: 14px;
      background: #111;
      aspect-ratio: 4/3;
      object-fit: cover;
    }

    .status {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
    }
    .status.esperando  { background: #fff3cd; color: #856404; }
    .status.conectado  { background: #d4edda; color: #155724; }
    .status.error      { background: #f8d7da; color: #721c24; }

    .room-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }
    label { font-size: 0.85rem; color: #666; }
    input {
      padding: 10px 14px;
      border: 1px solid #d0b8f5;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      letter-spacing: 2px;
      font-weight: 700;
      color: #5a3e8b;
    }
    input:focus { border-color: #5a3e8b; }

    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #5a3e8b, #8b5cf6);
      color: white; border: none; border-radius: 14px;
      font-size: 1.1rem; font-weight: 600; cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn:hover:not(:disabled) { opacity: 0.9; }

    .link-back {
      color: #5a3e8b; font-size: 0.9rem;
      text-decoration: none; margin-top: 8px;
    }
    .link-back:hover { text-decoration: underline; }

    .cam-toggle {
      background: #f0e8ff; border: none; border-radius: 20px;
      padding: 6px 16px; font-size: 0.85rem;
      color: #5a3e8b; cursor: pointer; margin-top: 10px;
    }
  </style>
</head>
<body>

<h1>📷 Cámara de Maruja</h1>
<p class="sub">Tu familiar te verá desde su dispositivo</p>

<div class="card">
  <div class="room-box">
    <label>Código de sala (compártelo con tu familiar)</label>
    <input type="text" id="roomCode" maxlength="20" placeholder="ej: maruja2024"
           oninput="this.value=this.value.toLowerCase().replace(/[^a-z0-9]/g,'')">
  </div>
  <button class="btn" id="btnIniciar" onclick="iniciar()">
    📷 Activar cámara
  </button>
</div>

<div class="card" id="videoCard" style="display:none">
  <video id="localVideo" autoplay muted playsinline></video>
  <button class="cam-toggle" onclick="cambiarCamara()">🔄 Cambiar cámara</button>
  <div class="status esperando" id="statusEl">
    ⏳ Esperando que tu familiar se conecte...
  </div>
</div>

<a class="link-back" href="index.html">← Volver al inicio</a>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
let peer = null;
let localStream = null;
let usandoFrontal = true;

function getRoomId() {
  return 'salud-mama-' + document.getElementById('roomCode').value.trim();
}

async function iniciar() {
  const codigo = document.getElementById('roomCode').value.trim();
  if (!codigo) { alert('Escribe un código de sala primero.'); return; }

  localStorage.setItem('salud_roomCode', codigo);

  document.getElementById('btnIniciar').disabled = true;
  document.getElementById('btnIniciar').textContent = 'Iniciando...';

  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: usandoFrontal ? 'user' : 'environment' },
      audio: true,
    });
    document.getElementById('localVideo').srcObject = localStream;
    document.getElementById('videoCard').style.display = 'block';
    document.getElementById('btnIniciar').style.display = 'none';

    conectarPeer();
  } catch (e) {
    alert('No se pudo acceder a la cámara: ' + e.message);
    document.getElementById('btnIniciar').disabled = false;
    document.getElementById('btnIniciar').textContent = '📷 Activar cámara';
  }
}

function conectarPeer() {
  if (peer) peer.destroy();

  peer = new Peer(getRoomId(), {
    host: '0.peerjs.com', port: 443, secure: true, path: '/',
  });

  peer.on('open', id => {
    console.log('Conectado como:', id);
    setStatus('esperando', '⏳ Esperando que tu familiar se conecte...');
  });

  peer.on('call', call => {
    setStatus('conectado', '✅ ¡Tu familiar está viéndote!');
    call.answer(localStream);
    call.on('close', () => setStatus('esperando', '⏳ Esperando que tu familiar se conecte...'));
    call.on('error',  () => setStatus('esperando', '⏳ Conexión perdida. Esperando...'));
  });

  peer.on('error', err => {
    if (err.type === 'unavailable-id') {
      setStatus('error', '❌ Ese código ya está en uso. Elige otro.');
    } else {
      setStatus('error', '❌ Error de conexión: ' + err.message);
    }
  });
}

async function cambiarCamara() {
  usandoFrontal = !usandoFrontal;
  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
  }
  localStream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: usandoFrontal ? 'user' : 'environment' },
    audio: true,
  });
  document.getElementById('localVideo').srcObject = localStream;
}

function setStatus(tipo, msg) {
  const el = document.getElementById('statusEl');
  el.className = 'status ' + tipo;
  el.textContent = msg;
}

// Recuperar código guardado
const saved = localStorage.getItem('salud_roomCode');
if (saved) document.getElementById('roomCode').value = saved;
</script>
</body>
</html>
