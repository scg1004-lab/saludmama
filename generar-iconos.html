<!DOCTYPE html>
<!-- Abre este archivo en el navegador, haz clic en el botón y descarga los iconos -->
<html><body style="font-family:sans-serif;padding:20px">
<h2>Generador de Íconos para la PWA</h2>
<p>Haz clic para generar y descargar los íconos necesarios.</p>
<button onclick="generar()" style="padding:10px 24px;font-size:1rem;cursor:pointer;background:#5a3e8b;color:white;border:none;border-radius:8px">
  Generar y descargar íconos
</button>
<canvas id="c" style="display:none"></canvas>
<script>
function dibujar(ctx, size) {
  // Fondo degradado
  const g = ctx.createLinearGradient(0, 0, size, size);
  g.addColorStop(0, '#5a3e8b');
  g.addColorStop(1, '#8b5cf6');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.roundRect(0, 0, size, size, size * 0.2);
  ctx.fill();
  // Corazón
  ctx.fillStyle = 'white';
  const s = size * 0.55;
  const x = (size - s) / 2;
  const y = (size - s) / 2 - size * 0.02;
  ctx.font = `${s}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('💜', size / 2, size / 2);
}

function generar() {
  const c = document.getElementById('c');
  [192, 512].forEach(size => {
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    dibujar(ctx, size);
    const a = document.createElement('a');
    a.download = `icon-${size}.png`;
    a.href = c.toDataURL('image/png');
    a.click();
  });
}
</script>
</body></html>
